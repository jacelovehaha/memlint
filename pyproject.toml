[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memlint"
version = "0.1.0"
description = "A hygiene linter for AI-agent memory files: duplicates, staleness, contradictions, and bloat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "memlint contributors" }]
keywords = ["ai-agents", "memory", "linter", "markdown", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
memlint = "memlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
